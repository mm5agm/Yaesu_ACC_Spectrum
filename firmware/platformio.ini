; Yaesu ACC spectrum: ESP32-S3-DevKitC-1 N16R8 (marked HW678).
; SPI slave on the ACC socket's scope data, raw frames out over the native USB.
;
; Upload is pinned to COM5, the board's CH343 port (the socket marked COM). Never
; let PlatformIO search for a port: COM3 and COM4 are the FTdx101MP's CP2105, and
; esptool's reset toggles DTR/RTS, which on the Standard port can key the radio.
; Flash with the radio's DC lead out. See firmware/README.md.

[env:esp32s3]
; PlatformIO's own ESP32 platform (Arduino-ESP32 2.x core), as YWC_IWC_PADDLE uses.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_flags =
    ; Serial is the native USB (the socket marked USB), where the frames go.
    ; Serial0 is the UART on the COM socket, for status text only.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
